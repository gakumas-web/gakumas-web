name: 检查静态项目
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test tests/*.test.mjs
      - run: python -B tools/check_public.py
      - run: python -B tools/build.py
      - run: pip install -r requirements-build.txt
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - run: docker build -t gakumas-web:check .
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/browser_content_updates.py
      - run: python -B tests/browser_image_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
