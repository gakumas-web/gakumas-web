name: 发布 GitHub Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布到 Pages；关闭时只验证构建与缓存'
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python -B tools/check_public.py
      - run: pip install -r requirements-build.txt
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/browser_content_updates.py
      - run: python -B tests/browser_image_delivery.py
      - run: python -B tests/browser_review_regressions.py
      - name: 计算图片缓存身份
        id: image-key
        run: echo "key=$(python -B tools/build_pages.py --cache-key)" >> "$GITHUB_OUTPUT"
      - name: 恢复图片构建缓存
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: local/pages-image-cache/${{ steps.image-key.outputs.key }}
          key: ${{ steps.image-key.outputs.key }}
          restore-keys: |
            ${{ steps.image-key.outputs.key }}-
      - name: 构建当前程序并复用图片
        id: site
        run: python -B tools/build_pages.py --image-cache local/pages-image-cache
      - name: 保存新生成的图片缓存
        if: steps.site.outputs.cache_saved == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: local/pages-image-cache/${{ steps.image-key.outputs.key }}
          key: ${{ steps.image-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存构建报告
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-report
          path: |
            dist/build-report.json
            dist/release.json
      - uses: actions/configure-pages@v5
        if: inputs.publish
      - uses: actions/upload-pages-artifact@v4
        if: inputs.publish
        with:
          path: dist/
  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
