name: 发布 GitHub Pages
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: '可选：复用同一提交、同一预览开关的既有运行制品编号；留空重新构建'
        type: string
        default: ''
      preview_account:
        description: '启用预览账号（当前测试站默认开启）'
        type: boolean
        default: true
      publish:
        description: '发布 Pages；关闭时仅生成可复用制品'
        type: boolean
        default: true
      publish_portable:
        description: '同时公开发布已验证的 Windows 便携版 Release'
        type: boolean
        default: false
  workflow_call:
    inputs:
      content_source_artifact:
        description: '本轮已固定并校验的公共资料引用制品'
        type: string
        required: true
      reuse_run_id:
        type: string
        default: ''
      preview_account:
        type: boolean
        default: true
      publish:
        type: boolean
        default: true
      publish_portable:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_sha256: ${{ steps.site-identity.outputs.site_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: python -B tools/check_public.py
      - run: pip install -r requirements-build.txt
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/browser_content_updates.py
      - run: python -B tests/browser_image_delivery.py
      - run: python -B tests/browser_review_regressions.py
      - name: 读取已有站点制品
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$REUSE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name portable-site --dir dist
      - name: 读取自动更新固定引用
        if: inputs.reuse_run_id == '' && inputs.content_source_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.content_source_artifact }}
          path: local/content-source
      - name: 固定本次手动构建的内容引用
        if: inputs.reuse_run_id == '' && inputs.content_source_artifact == ''
        run: python -B tools/sync_content.py --allow-bootstrap
      - name: 计算图片缓存身份
        if: inputs.reuse_run_id == ''
        id: image-key
        run: |
          pages_image_key="$(python -B tools/build_pages.py --source local/content-source/pages-source.json --cache-key)"
          echo "key=$pages_image_key" >> "$GITHUB_OUTPUT"
      - name: 恢复图片构建缓存
        if: inputs.reuse_run_id == ''
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: local/pages-image-cache/${{ steps.image-key.outputs.key }}
          key: ${{ steps.image-key.outputs.key }}
          restore-keys: |
            ${{ steps.image-key.outputs.key }}-
      - name: 构建当前程序并复用图片
        if: inputs.reuse_run_id == ''
        id: site
        env:
          ENABLE_PREVIEW_ACCOUNT: ${{ inputs.preview_account }}
        run: |
          if [ "$ENABLE_PREVIEW_ACCOUNT" = "true" ]; then
            python -B tools/build_pages.py --source local/content-source/pages-source.json --image-cache local/pages-image-cache --preview-account
          else
            python -B tools/build_pages.py --source local/content-source/pages-source.json --image-cache local/pages-image-cache --no-preview-account
          fi
      - name: 保存新生成的图片缓存
        if: steps.site.outputs.cache_saved == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: local/pages-image-cache/${{ steps.image-key.outputs.key }}
          key: ${{ steps.image-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 准备固定版本的引擎打包器
        if: inputs.reuse_run_id == ''
        run: |
          python -m pip install PyYAML==6.0.3
          npm install --prefix local/engine-tools --no-save --ignore-scripts esbuild@0.28.1
      - name: 核对并应用配套引擎更新
        if: inputs.reuse_run_id == ''
        id: engine-update
        run: |
          if [ -f local/content-source/engine-update.json ]; then
            python -B tools/update_contest_engine.py --site dist --esbuild local/engine-tools/node_modules/.bin/esbuild --plan local/content-source/engine-update.json --apply
          else
            python -B tools/update_contest_engine.py --site dist --esbuild local/engine-tools/node_modules/.bin/esbuild --apply
          fi
      - name: 用通过校验的引擎重建站点
        if: steps.engine-update.outputs.updated == 'true'
        env:
          ENABLE_PREVIEW_ACCOUNT: ${{ inputs.preview_account }}
        run: |
          if [ "$ENABLE_PREVIEW_ACCOUNT" = "true" ]; then
            python -B tools/build_pages.py --source local/content-source/pages-source.json --image-cache local/pages-image-cache --preview-account
          else
            python -B tools/build_pages.py --source local/content-source/pages-source.json --image-cache local/pages-image-cache --no-preview-account
          fi
      - name: 保存引擎候选与固定来源
        if: always() && inputs.reuse_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: engine-update
          path: |
            local/engine-update/*.json
            local/engine-update/candidate/tools/contest-*.json
            local/engine-update/candidate/domain/contest-engine-map.mjs
            local/engine-update/candidate/domain/upstream-contest-engine.mjs
          if-no-files-found: ignore
      - name: 核对站点制品身份
        id: site-identity
        env:
          ENABLE_PREVIEW_ACCOUNT: ${{ inputs.preview_account }}
        run: python -B tools/verify_portable_artifacts.py --site dist --expected-commit "$GITHUB_SHA" --expected-preview "$ENABLE_PREVIEW_ACCOUNT"
      - name: 审计模拟引擎完整公开候选池
        run: node tools/audit_contest_engine.mjs --site dist --baseline tools/contest-engine-compatibility-baseline.json --report local/contest-engine-audit.json
      - name: 验收模拟交互、迁移、草稿与任务隔离
        timeout-minutes: 15
        run: |
          python -B - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          import subprocess
          import sys
          class Handler(SimpleHTTPRequestHandler):
              def log_message(self, *args):
                  pass
          server = ThreadingHTTPServer(('127.0.0.1', 0), partial(Handler, directory='dist'))
          thread = Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f'http://127.0.0.1:{server.server_port}/'
              for script in ('browser_optimization_autofill', 'browser_optimization_custom_budget', 'browser_contest_task_lifecycle', 'browser_contest_loadout_package', 'browser_contest_drafts', 'browser_contest_draft_locale'):
                  subprocess.run([sys.executable, '-B', f'tests/{script}.py', '--url', url], check=True)
              subprocess.run([sys.executable, '-B', 'tests/browser_contest_compute_contention.py', '--url', url, '--gated'], check=True)
          finally:
              server.shutdown()
              server.server_close()
              thread.join()
          PY
      - name: 保存模拟交互验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-browser-acceptance
          path: |
            local/checks/review067-followup/
            local/checks/nextsteps-20261016/
            local/checks/optimization-autofill/
          if-no-files-found: ignore
      - name: 保存模拟引擎审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-engine-audit
          path: local/contest-engine-audit.json
          if-no-files-found: ignore
      - name: 保存可复用站点制品
        uses: actions/upload-artifact@v4
        with:
          name: portable-site
          path: dist/
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: 保存构建报告
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-report
          path: |
            dist/build-report.json
            dist/release.json
      - uses: actions/configure-pages@v5
        if: inputs.publish
      - uses: actions/upload-pages-artifact@v4
        if: inputs.publish
        with:
          path: dist/
  portable:
    needs: build
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 读取已有便携制品
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          if ($env:REUSE_RUN_ID -notmatch '^[0-9]+$') { throw '运行编号无效' }
          gh run download "$env:REUSE_RUN_ID" --repo "$env:GITHUB_REPOSITORY" --name windows-portable --dir portable-output
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run_id == ''
        with:
          name: portable-site
          path: site/dist
      - uses: actions/setup-go@v6
        if: inputs.reuse_run_id == ''
        with:
          go-version: '1.26.8'
          cache: false
      - name: 测试并编译 Windows 启动器
        if: inputs.reuse_run_id == ''
        working-directory: tools/portable-server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o ../../local/portable-build/gakumas-web.exe .
      - name: 封装同一站点构建
        if: inputs.reuse_run_id == ''
        run: |
          $goRoot = go env GOROOT
          python -B tools/package_portable.py --site site/dist --launcher local/portable-build/gakumas-web.exe --go-license "$goRoot/LICENSE" --output portable-output
      - name: 核对便携制品身份
        env:
          EXPECTED_SITE: ${{ needs.build.outputs.site_sha256 }}
          ENABLE_PREVIEW_ACCOUNT: ${{ inputs.preview_account }}
        run: python -B tools/verify_portable_artifacts.py --portable portable-output --expected-commit "$env:GITHUB_SHA" --expected-site "$env:EXPECTED_SITE" --expected-preview "$env:ENABLE_PREVIEW_ACCOUNT"
      - name: 解压并实际启动 Windows exe
        run: |
          $package = (Get-ChildItem portable-output/*.zip).FullName
          python -B tools/test_portable.py --package "$package"
      - name: 保存可复用便携制品
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: portable-output/
          compression-level: 0
          retention-days: 7
          overwrite: true
  deploy:
    if: inputs.publish
    needs: [build, portable]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 读取自动更新固定引用
        if: inputs.content_source_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.content_source_artifact }}
          path: local/content-source
      - name: 拒绝被新版本取代的自动发布
        if: inputs.content_source_artifact != ''
        run: python -B tools/sync_content.py --verify-current local/content-source/pages-source.json
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: inputs.publish && inputs.publish_portable
    needs: [deploy, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: portable-output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 从已验证制品发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/publish_portable.py --directory portable-output
